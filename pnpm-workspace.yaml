allowBuilds:
  esbuild: true

# DSH's rc packages are published together and are intentionally pinned in
# the lockfile. Keep pnpm's default release-age gate for every other package,
# while explicitly reviewing this small, known compatibility set.
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis@4.0.1'
  - '@deepseek-ai/cosmokit@1.8.2'
  - '@deepseek-ai/dsh-attachment@0.1.0-rc.6'
  - '@deepseek-ai/dsh-brand@0.1.0-rc.6'
  - '@deepseek-ai/dsh-invariants@0.1.0-rc.6'
  - '@deepseek-ai/dsh-llm@0.1.0-rc.6'
  - '@deepseek-ai/dsh-timeout@0.1.0-rc.6'
  - '@deepseek-ai/dsh-web@0.1.0-rc.6'
  - '@deepseek-ai/schemastery@3.18.1'
