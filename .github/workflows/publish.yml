name: Publish package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

# Configure this exact workflow file as the npm Trusted Publisher for the
# package after the first package record exists. No long-lived NPM_TOKEN is
# read by this job.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 11.21.0
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify
        run: |
          pnpm run typecheck
          pnpm test
          pnpm run build
      - name: Pack exact artifact
        id: pack
        shell: bash
        run: |
          tarball="$(npm pack --silent)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          npm pack --dry-run --json
      - name: Publish with OIDC provenance
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag=latest
          if [[ "$version" == *-* ]]; then tag=next; fi
          npm publish "$TARBALL" --access public --tag "$tag"
      - name: Verify registry signatures
        run: npm audit signatures
